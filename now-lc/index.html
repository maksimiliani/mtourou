<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgeting App</title>
</head>
<body>
  <h1>Google Sheets Data</h1>
  <div id="sheet-data"></div>

  <script>
    // Replace with your actual spreadsheet ID and API Key
    const spreadsheetId = '1Pnvs5qEDF3qtGs8UoT45v3XoRrbJSZdvrqYw6WOn7eE';
    const apiKey = 'AIzaSyBrMFxEH3bCkcpJR3xFEff86HzLoyXGAg8';
    const range = 'NowLiqCig!J14:J22'; // Adjust range based on your sheet

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        // Process and display the data
        const values = data.values;
        if (values) {
          const table = document.createElement('table');
          values.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
              const td = document.createElement('td');
              td.textContent = cell;
              tr.appendChild(td);
            });
            table.appendChild(tr);
          });
          document.getElementById('sheet-data').appendChild(table);
        } else {
          document.getElementById('sheet-data').textContent = 'No data found.';
        }
      })
      .catch(error => console.error('Error fetching data:', error));
  </script>
</body>
</html>
