<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgeting App</title>
</head>
<body>
  <div id="sheet-data"></div>

  <script>
    // Replace with your actual spreadsheet ID and API Key
    const spreadsheetId = '1Pnvs5qEDF3qtGs8UoT45v3XoRrbJSZdvrqYw6WOn7eE';
    const apiKey = 'AIzaSyBrMFxEH3bCkcpJR3xFEff86HzLoyXGAg8';
    const range = 'NowLiqCig2'; // Adjust range based on your sheet

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        // Process and display the data
        const values = data.values;
        if (values) {

            let alldata = [
                { title: 'Liq', value: values[13, 9] },
                { title: 'Cig', value: values[14, 9] },
                { title: 'IQOS', value: values[15, 9] },
                { title: 'Uber', value: values[19, 9] },
                { title: 'Groc', value: values[20, 9] }
            ];
            for (let i = 0; i < alldata.length; i++) {
                let div = document.createElement('div');
                let h2 = document.createElement('h2');
                let p = document.createElement('p');
                h2.innerHTML = alldata[i].title;
                p.innerHTML = alldata[i].value;
                div.appendChild(h2);
                div.appendChild(p);
                document.getElementById('sheet-data').appendChild(div);
            }

        } else {
          document.getElementById('sheet-data').textContent = 'No data found.';
        }
      })
      .catch(error => console.error('Error fetching data:', error));
  </script>
</body>
</html>
