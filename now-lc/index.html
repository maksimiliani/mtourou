<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgeting App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    html {font-size: 100%;}
    body {font-size: 1rem; transition: all 0.15s ease-in-out; margin: 0; padding: 0; font-family: "Space Grotesk", serif; font-optical-sizing: auto; font-weight: 300; font-style: normal; min-height: 100vh;}
    .data {display: flex; flex-direction: row; justify-content: space-around; align-items: stretch; height: 100vh;}
    .data div {display: flex; flex-direction: column; text-align: center; justify-content: center;}
    .data h2 {font-size: clamp(1.5rem, calc(1.5rem + 2vw), 2rem); margin: 0;}
    .data p {font-size: clamp(5rem, calc(5rem + 5vw), 8rem); font-weight: 700; margin: 0;}

    [data-scheme=light] body {
        background: white;
        color: rgb(45, 45, 45);
    }

    [data-scheme=dark] body {
        background: rgb(45, 45, 45);
        color: rgb(220, 220, 220);
    }

    @media only screen and (max-width: 920px) {
        #sheet-data {flex-direction: column; height: auto; gap: 48px; padding: 64px 0;}
    }
  </style>
</head>
<body>
  <div id="sheet-data" class="data"></div>
  <div id="savings" class="data"></div>

  <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.querySelector("html").setAttribute("data-scheme", "dark");
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        document.querySelector("html").setAttribute("data-scheme", event.matches ? "dark" : "light");
    });


    // Replace with your actual spreadsheet ID and API Key
    const spreadsheetId = '1Pnvs5qEDF3qtGs8UoT45v3XoRrbJSZdvrqYw6WOn7eE';
    const apiKey = 'AIzaSyBrMFxEH3bCkcpJR3xFEff86HzLoyXGAg8';
    const range = `NowLiqCig`; // Adjust range based on your sheet

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
    let curr_month = new Date().getMonth() + 10;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        // Process and display the data
        const values = data.values;
        if (values) {

            let alldata = [
                { title: values[14][0], value: values[14][curr_month] },
                { title: values[15][0], value: values[15][curr_month] },
                { title: values[16][0], value: values[16][curr_month] },
                { title: values[20][0], value: values[20][curr_month] },
                { title: values[21][0], value: values[21][curr_month] },
                { title: values[24][0], value: values[24][curr_month] }
            ];
            for (let i = 0; i < (alldata.length - 1); i++) {
                let div = document.createElement('div');
                let h2 = document.createElement('h2');
                let p = document.createElement('p');
                h2.innerHTML = alldata[i].title;
                p.innerHTML = alldata[i].value;
                div.appendChild(h2);
                div.appendChild(p);
                document.getElementById('sheet-data').appendChild(div);
            }
            let div = document.createElement('div');
            let h2 = document.createElement('h2');
            let p = document.createElement('p');
            h2.innerHTML = alldata[5].title;
            p.innerHTML = alldata[5].value;
            div.appendChild(h2);
            div.appendChild(p);
            document.getElementById('savings').appendChild(div);

        } else {
          document.getElementById('sheet-data').textContent = 'No data found.';
        }
      })
      .catch(error => console.error('Error fetching data:', error));
  </script>
</body>
</html>
